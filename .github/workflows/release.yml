name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Run Tests
        run: go test ./... -v

      - name: Build Multi-Platform Binaries
        run: |
          mkdir -p dist
          TAG_NAME="${GITHUB_REF_NAME:-v1.4.0}"
          echo "Building binaries for tag: $TAG_NAME"

          LDFLAGS="-s -w -X main.version=$TAG_NAME"

          # Linux
          GOOS=linux GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/gogate-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/gogate-linux-arm64 .

          # macOS (Darwin)
          GOOS=darwin GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/gogate-darwin-amd64 .
          GOOS=darwin GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/gogate-darwin-arm64 .

          # Windows
          GOOS=windows GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/gogate-windows-amd64.exe .
          GOOS=windows GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/gogate-windows-arm64.exe .

      - name: Package Archives & Checksums
        working-directory: dist
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v1.4.0}"

          # Compress Linux & Darwin binaries as tar.gz
          tar -czvf "gogate_${TAG_NAME}_linux_amd64.tar.gz" gogate-linux-amd64
          tar -czvf "gogate_${TAG_NAME}_linux_arm64.tar.gz" gogate-linux-arm64
          tar -czvf "gogate_${TAG_NAME}_darwin_amd64.tar.gz" gogate-darwin-amd64
          tar -czvf "gogate_${TAG_NAME}_darwin_arm64.tar.gz" gogate-darwin-arm64

          # Zip Windows binaries
          zip "gogate_${TAG_NAME}_windows_amd64.zip" gogate-windows-amd64.exe
          zip "gogate_${TAG_NAME}_windows_arm64.zip" gogate-windows-arm64.exe

          # Compute SHA256 checksums
          sha256sum gogate_${TAG_NAME}_* > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/gogate_*_linux_amd64.tar.gz
            dist/gogate_*_linux_arm64.tar.gz
            dist/gogate_*_darwin_amd64.tar.gz
            dist/gogate_*_darwin_arm64.tar.gz
            dist/gogate_*_windows_amd64.zip
            dist/gogate_*_windows_arm64.zip
            dist/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
